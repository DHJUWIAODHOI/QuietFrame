name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      compare:
        description: Benchmark a baseline commit and this commit side by side in one job
        type: boolean
        default: false
      baseline_ref:
        description: Commit or tag the comparison measures against
        type: string
        default: 6d83bea
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Archive QuietFrame
    runs-on: macos-15
    timeout-minutes: 75

    env:
      BENCHMARK_CLASSES: CryptoBenchmarks ThumbnailBenchmarks LibraryBenchmarks ViewerBenchmarks ImportBenchmarks CryptoEngineBenchmarks StorageBenchmarks GalleryBenchmarks ImportPipelineBenchmarks VideoScrubbingBenchmarks ReconcileBenchmarks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          xcrun simctl list runtimes

      # Simulator apps need an (ad-hoc) code signature for Keychain access;
      # an unsigned test host fails every SecItem call.
      # The benchmarks are skipped here and run on their own in an optimized build below.
      # One simulator clone: a second clone has failed to launch on these runners and once crashed xcodebuild.
      - name: Run full tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          SKIP_BENCHMARKS=()
          for class in $BENCHMARK_CLASSES; do
            SKIP_BENCHMARKS+=("-skip-testing:QuietFrameTests/$class")
          done
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -destination-timeout 120 \
            -parallel-testing-worker-count 1 \
            -resultBundlePath "$RUNNER_TEMP/QuietFrameTests.xcresult" \
            "${SKIP_BENCHMARKS[@]}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test \
            | tee "$RUNNER_TEMP/xctest.log"

      # SwiftData query shapes again on an older runtime the image includes; iOS 17 runs at the end of the job.
      - name: Run SwiftData tests on iOS 18.5
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -destination-timeout 120 \
            -parallel-testing-worker-count 1 \
            -only-testing:QuietFrameTests/GallerySortingTests \
            -only-testing:QuietFrameTests/LibraryQueryTests \
            -only-testing:QuietFrameTests/AlbumServiceTests \
            -only-testing:QuietFrameTests/TrashServiceTests \
            -only-testing:QuietFrameTests/StorageReconciliationServiceTests \
            -only-testing:QuietFrameTests/MediaExportServiceTests \
            -only-testing:QuietFrameTests/AlbumCountsTests \
            -only-testing:QuietFrameTests/AlbumsScreenTests \
            -only-testing:QuietFrameTests/GalleryRefreshTests \
            -only-testing:QuietFrameTests/GallerySearchMatcherTests \
            -only-testing:QuietFrameTests/StorageAnalysisServiceTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test \
            | tee "$RUNNER_TEMP/swiftdata-ios18.log"

      # Serial and optimized like a Release build, so timings are not skewed by parallel
      # simulator clones or -Onone. Compare runs only on matching runner hardware.
      - name: Run performance benchmarks
        timeout-minutes: 25
        run: |
          set -o pipefail
          ONLY_BENCHMARKS=()
          for class in $BENCHMARK_CLASSES; do
            ONLY_BENCHMARKS+=("-only-testing:QuietFrameTests/$class")
          done
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/BenchmarkDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/QuietFrameBenchmarks.xcresult" \
            -parallel-testing-enabled NO \
            "${ONLY_BENCHMARKS[@]}" \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test \
            | tee "$RUNNER_TEMP/benchmarks.log"

      - name: Summarize benchmarks
        if: always()
        run: |
          LOG="$RUNNER_TEMP/benchmarks.log"
          {
            echo "## Benchmarks"
            echo
            echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "| Class | Test | Metric | Average | RSD | Values |"
            echo "| --- | --- | --- | --- | --- | --- |"
            if [ -f "$LOG" ]; then
              grep -E "measured \[" "$LOG" \
                | sed -E "s/.*-\[QuietFrameTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' measured \[([^]]+)\] average: (-?[0-9.]+), relative standard deviation: ([^%]*%), values: \[([^]]*)\].*/| \1 | \2 | \3 | \4 | \5 | \6 |/" \
                || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-benchmarks
          path: |
            ${{ runner.temp }}/benchmarks.log
            ${{ runner.temp }}/QuietFrameBenchmarks.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize test failures
        if: failure() || cancelled()
        run: |
          for RESULT in "$RUNNER_TEMP/QuietFrameTests.xcresult" "$RUNNER_TEMP/QuietFrameBenchmarks.xcresult"; do
            if [ -d "$RESULT" ]; then
              xcrun xcresulttool get test-results summary --path "$RESULT" || true
            fi
          done
          grep -E -A8 '^(CodeSign|ProcessProductPackaging) .*QuietFrame\.app' "$RUNNER_TEMP/xctest.log" | head -80 || true

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuietFrame.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean archive \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/QuietFrame.xcarchive/Products/Applications/QuietFrame.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/QuietFrame.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload QuietFrame-unsigned.ipa
          shasum -a 256 QuietFrame-unsigned.ipa > QuietFrame-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-unsigned-ipa
          path: |
            ${{ runner.temp }}/package/QuietFrame-unsigned.ipa
            ${{ runner.temp }}/package/QuietFrame-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-build-log
          path: |
            ${{ runner.temp }}/xctest.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/QuietFrameTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # SwiftData query shapes on the deployment target. The image has no iOS 17 simulator, so one is installed
      # here, after the IPA is uploaded: an iOS 17 failure never blocks the IPA, and this check still runs when an
      # earlier step fails. It was a separate job, which often never got a macOS runner.
      - name: Install an iOS 17 simulator
        id: ios17
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          if ! xcrun simctl list runtimes | grep -q '^iOS 17\.'; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.5
          fi
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS 17.")))] | last | .identifier')
          test -n "$RUNTIME" && test "$RUNTIME" != null
          UDID=$(xcrun simctl create "QuietFrame iOS 17" com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          echo "IOS17_SIMULATOR=$UDID" >> "$GITHUB_ENV"

      # Same ad-hoc signing as the main test step: an unsigned test host has no Keychain access.
      - name: Run SwiftData tests on iOS 17
        id: ios17_tests
        if: ${{ !cancelled() && steps.ios17.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$IOS17_SIMULATOR" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/SwiftDataIOS17.xcresult" \
            -only-testing:QuietFrameTests/LibraryQueryTests \
            -only-testing:QuietFrameTests/GallerySortingTests \
            -only-testing:QuietFrameTests/AlbumServiceTests \
            -only-testing:QuietFrameTests/TrashServiceTests \
            -only-testing:QuietFrameTests/StorageReconciliationServiceTests \
            -only-testing:QuietFrameTests/MediaExportServiceTests \
            -only-testing:QuietFrameTests/AlbumCountsTests \
            -only-testing:QuietFrameTests/AlbumsScreenTests \
            -only-testing:QuietFrameTests/GalleryRefreshTests \
            -only-testing:QuietFrameTests/GallerySearchMatcherTests \
            -only-testing:QuietFrameTests/StorageAnalysisServiceTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test

      - name: Upload iOS 17 results on failure
        if: ${{ cancelled() || steps.ios17_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-swiftdata-ios17
          path: ${{ runner.temp }}/SwiftDataIOS17.xcresult
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: Compare benchmarks with a baseline
    if: github.event_name == 'workflow_dispatch' && inputs.compare
    runs-on: macos-15
    timeout-minutes: 120

    env:
      BENCHMARK_CLASSES: CryptoBenchmarks ThumbnailBenchmarks LibraryBenchmarks ViewerBenchmarks ImportBenchmarks CryptoEngineBenchmarks StorageBenchmarks GalleryBenchmarks ImportPipelineBenchmarks VideoScrubbingBenchmarks ReconcileBenchmarks
      DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro,OS=latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner
        run: |
          xcodebuild -version
          echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"

      - name: Check out the baseline
        run: git worktree add "$RUNNER_TEMP/baseline" "${{ inputs.baseline_ref }}"

      - name: Build both for testing
        run: |
          set -o pipefail
          build() {
            xcodebuild \
              -project "$1/QuietFrame.xcodeproj" \
              -scheme QuietFrame \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "$DESTINATION" \
              -destination-timeout 120 \
              -derivedDataPath "$2" \
              SWIFT_OPTIMIZATION_LEVEL=-O \
              SWIFT_COMPILATION_MODE=wholemodule \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              build-for-testing | tail -5
          }
          build "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/dd-baseline"
          build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dd-candidate"

      - name: Run benchmarks alternately
        run: |
          set -o pipefail
          ONLY=()
          for class in $BENCHMARK_CLASSES; do
            ONLY+=("-only-testing:QuietFrameTests/$class")
          done
          run() {
            xcodebuild \
              -xctestrun "$(ls "$1"/Build/Products/*.xctestrun | head -1)" \
              -destination "$DESTINATION" \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              "${ONLY[@]}" \
              test-without-building | tee "$2" | grep -E "measured \[|error:|failed" || true
          }
          for round in 1 2; do
            run "$RUNNER_TEMP/dd-baseline" "$RUNNER_TEMP/baseline-$round.log"
            run "$RUNNER_TEMP/dd-candidate" "$RUNNER_TEMP/candidate-$round.log"
          done

      - name: Summarize comparison
        if: always()
        run: |
          {
            echo "## Benchmarks: ${{ inputs.baseline_ref }} against $GITHUB_SHA"
            echo
            echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs. Each side ran twice, alternating; averages of both runs."
            echo
            python3 .github/scripts/compare_benchmarks.py "$RUNNER_TEMP"/baseline-*.log -- "$RUNNER_TEMP"/candidate-*.log
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-benchmark-comparison
          path: |
            ${{ runner.temp }}/baseline-*.log
            ${{ runner.temp }}/candidate-*.log
          if-no-files-found: ignore
          retention-days: 30
