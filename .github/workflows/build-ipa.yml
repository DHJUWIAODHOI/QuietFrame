name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Archive QuietFrame
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BENCHMARK_CLASSES: CryptoBenchmarks ThumbnailBenchmarks LibraryBenchmarks ViewerBenchmarks ImportBenchmarks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          xcrun simctl list runtimes

      # Simulator apps need an (ad-hoc) code signature for Keychain access;
      # an unsigned test host fails every SecItem call.
      # The benchmarks are skipped here and run on their own in an optimized build below.
      - name: Run full tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          SKIP_BENCHMARKS=()
          for class in $BENCHMARK_CLASSES; do
            SKIP_BENCHMARKS+=("-skip-testing:QuietFrameTests/$class")
          done
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -destination-timeout 120 \
            -resultBundlePath "$RUNNER_TEMP/QuietFrameTests.xcresult" \
            "${SKIP_BENCHMARKS[@]}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test \
            | tee "$RUNNER_TEMP/xctest.log"

      # Serial and optimized like a Release build, so timings are not skewed by parallel
      # simulator clones or -Onone. Compare runs only on matching runner hardware.
      - name: Run performance benchmarks
        timeout-minutes: 25
        run: |
          set -o pipefail
          ONLY_BENCHMARKS=()
          for class in $BENCHMARK_CLASSES; do
            ONLY_BENCHMARKS+=("-only-testing:QuietFrameTests/$class")
          done
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/BenchmarkDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/QuietFrameBenchmarks.xcresult" \
            -parallel-testing-enabled NO \
            "${ONLY_BENCHMARKS[@]}" \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test \
            | tee "$RUNNER_TEMP/benchmarks.log"

      - name: Summarize benchmarks
        if: always()
        run: |
          LOG="$RUNNER_TEMP/benchmarks.log"
          {
            echo "## Benchmarks"
            echo
            echo "Runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "| Class | Test | Metric | Average | RSD | Values |"
            echo "| --- | --- | --- | --- | --- | --- |"
            if [ -f "$LOG" ]; then
              grep -E "measured \[" "$LOG" \
                | sed -E "s/.*-\[QuietFrameTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' measured \[([^]]+)\] average: ([0-9.]+), relative standard deviation: ([0-9.]+%), values: \[([^]]*)\].*/| \1 | \2 | \3 | \4 | \5 | \6 |/" \
                || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-benchmarks
          path: |
            ${{ runner.temp }}/benchmarks.log
            ${{ runner.temp }}/QuietFrameBenchmarks.xcresult
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize test failures
        if: failure() || cancelled()
        run: |
          for RESULT in "$RUNNER_TEMP/QuietFrameTests.xcresult" "$RUNNER_TEMP/QuietFrameBenchmarks.xcresult"; do
            if [ -d "$RESULT" ]; then
              xcrun xcresulttool get test-results summary --path "$RESULT" || true
            fi
          done
          grep -E -A8 '^(CodeSign|ProcessProductPackaging) .*QuietFrame\.app' "$RUNNER_TEMP/xctest.log" | head -80 || true

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietFrame.xcodeproj \
            -scheme QuietFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuietFrame.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean archive \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/QuietFrame.xcarchive/Products/Applications/QuietFrame.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/QuietFrame.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload QuietFrame-unsigned.ipa
          shasum -a 256 QuietFrame-unsigned.ipa > QuietFrame-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-unsigned-ipa
          path: |
            ${{ runner.temp }}/package/QuietFrame-unsigned.ipa
            ${{ runner.temp }}/package/QuietFrame-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: QuietFrame-build-log
          path: |
            ${{ runner.temp }}/xctest.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/QuietFrameTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
